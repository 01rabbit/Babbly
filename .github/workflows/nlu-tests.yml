name: Babbly core safety tests

on:
  pull_request:
  push:
    branches:
      - main
      - agent/**

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run core tests
        run: python -m pytest -q tests
      - name: Compile benchmark evaluator
        run: python -m py_compile tools/evaluate_asr_results.py
