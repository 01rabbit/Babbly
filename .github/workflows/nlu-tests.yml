name: Babbly core safety tests

on:
  pull_request:
  push:
    branches:
      - main
      - agent/**

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install "pytest>=8,<10"
      - name: Compile Python sources
        run: python -m compileall -q babbly tools tests
      - name: Run core tests
        run: python -m pytest -q tests
